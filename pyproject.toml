[project]
name = "oop_les"
version = "0.1.0"
description = ""
authors = [
    {name = "Khisniddin",email = "you@example.com"}
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.11.0"
isort = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.black]
line-length = 119
exclude = '.git'

[tool.mypy]
disallow_untyped_defs=true
warn_return_any = true
exclude = 'venv'